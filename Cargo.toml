[package]
name = "motd-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A fast, compact, read-only system status dashboard for the Linux message of the day"
license = "MIT"
repository = "https://github.com/ardeidae/motd-rs"
readme = "README.md"
keywords = ["motd", "linux", "sysadmin", "dashboard", "login"]
categories = ["command-line-utilities"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zbus = { version = "6", default-features = false, features = ["comms", "default-rt"] }

[lints.rust]
unsafe_code = "deny" # allowed only in src/sys.rs
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "deny" # write through a locked handle and handle errors (broken pipe)
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
